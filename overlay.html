<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DCC Dice Background</title>
</head>
<body>
<!--
  This page is loaded via manifest.json's background_url. Owlbear Rodeo
  does not render background pages visibly on screen — they exist purely
  to run headless logic (listening for broadcasts, scene changes, etc).
  To actually show something over the map, this page opens a full-screen
  modal (OBR.modal.open) pointing at dice-modal.html, which is where the
  real animation lives.
-->
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

const DICE_ROLL_CHANNEL = "com.claude.monster-sheet/dice-roll";
const DICE_MODAL_ID = "com.claude.monster-sheet/dice-modal";
const DICE_MODAL_URL = "https://ostendpirate.github.io/Crawl-Bear-Classics/dice-modal.html";

function openDiceModal(payload) {
  const dice = Array.isArray(payload.dice) ? payload.dice : [];
  if (!dice.length) return;

  // Each die keeps its own sides (a d20 attack roll, a damage die, and a
  // Deed Die can all ride in the same roll) - encoded as "sides:value"
  // pairs rather than a single shared "sides" so dice-modal.html can draw
  // each one with its own shape instead of assuming a uniform batch.
  const params = new URLSearchParams({
    roller: payload.rollerName || "Someone",
    notation: payload.notation || "",
    modifier: String(payload.modifier || 0),
    total: String(payload.total ?? ""),
    dice: dice.map(d => `${d.sides}:${d.value}`).join(","),
  });
  if (payload.label) params.set("label", payload.label);

  OBR.modal.open({
    id: DICE_MODAL_ID,
    url: `${DICE_MODAL_URL}?${params.toString()}`,
    fullScreen: true,
    hideBackdrop: true,
    hidePaper: true,
    disablePointerEvents: true,
  }).catch(err => console.error("DCC dice background: failed to open modal", err));

  // Fallback close in case dice-modal.html's own self-close timer never
  // fires for some reason (backgrounded tab throttling timers, etc).
  setTimeout(() => {
    OBR.modal.close(DICE_MODAL_ID).catch(() => {});
  }, 6500);
}

OBR.onReady(() => {
  OBR.broadcast.onMessage(DICE_ROLL_CHANNEL, (event) => {
    try {
      openDiceModal(event.data);
    } catch (err) {
      console.error("DCC dice background: failed to handle roll broadcast", err);
    }
  });
});
</script>
</body>
</html>
