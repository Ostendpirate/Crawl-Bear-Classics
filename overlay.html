<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DCC Dice Background</title>
</head>
<body>
<!--
  This page is loaded via manifest.json's background_url. Owlbear Rodeo
  does not render background pages visibly on screen — they exist purely
  to run headless logic (listening for broadcasts, scene changes, etc).
  To actually show something over the map, this page opens a full-screen
  modal (OBR.modal.open) pointing at dice-modal.html, which is where the
  real animation lives.
-->
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

const DICE_ROLL_CHANNEL = "com.claude.monster-sheet/dice-roll";
const DICE_MODAL_ID = "com.claude.monster-sheet/dice-modal";
const DICE_MODAL_URL = "https://ostendpirate.github.io/Crawl-Bear-Classics/dice-modal.html";

// Matches map-pins-modal.html's own copy of this key - room-pin markers
// created there carry it, this background page reads it back to offer a
// click-to-select "Open Room Notes" jump on them (Owlbear's contextMenu
// API shows its icon(s) when an item is SELECTED, not on right-click -
// see docs.owlbear.rodeo's own Context Menu tutorial).
const ROOM_PIN_METADATA_KEY = "com.claude.monster-sheet/room-pin";
// Creature tokens added by GM Notes' "Extract + Add Tokens" carry the Area
// id they were written under (and start inactive in the tracker) - see
// gm-notes-modal.html's ENCOUNTER_ROOM_METADATA_KEY.
const ENCOUNTER_ROOM_METADATA_KEY = "com.claude.monster-sheet/encounter-room";
const ENCOUNTER_STAGED_METADATA_KEY = "com.claude.monster-sheet/encounter-staged";
const COMBAT_METADATA_KEY = "com.claude.monster-sheet/combat-data";
const DIM_OVERLAY_METADATA_KEY = "com.claude.monster-sheet/dim-overlay";
const GM_NOTES_MODAL_ID = "com.claude.monster-sheet/gm-notes-modal";
const GM_NOTES_MODAL_URL = "https://ostendpirate.github.io/Crawl-Bear-Classics/gm-notes-modal.html";
// gm-notes-modal.html listens on this so an ALREADY-OPEN copy of that
// modal can jump straight there - see that file's own comment on this
// same constant for why a plain OBR.modal.open re-call can't reach it.
const JUMP_TO_ROOM_CHANNEL = "com.claude.monster-sheet/jump-to-room";

function openDiceModal(payload) {
  const dice = Array.isArray(payload.dice) ? payload.dice : [];
  if (!dice.length) return;

  // Each die keeps its own sides (a d20 attack roll, a damage die, and a
  // Deed Die can all ride in the same roll) - encoded as "sides:value"
  // pairs rather than a single shared "sides" so dice-modal.html can draw
  // each one with its own shape instead of assuming a uniform batch.
  const params = new URLSearchParams({
    roller: payload.rollerName || "Someone",
    notation: payload.notation || "",
    modifier: String(payload.modifier || 0),
    total: String(payload.total ?? ""),
    dice: dice.map(d => `${d.sides}:${d.value}`).join(","),
  });
  if (payload.label) params.set("label", payload.label);

  OBR.modal.open({
    id: DICE_MODAL_ID,
    url: `${DICE_MODAL_URL}?${params.toString()}`,
    fullScreen: true,
    hideBackdrop: true,
    hidePaper: true,
    disablePointerEvents: true,
  }).catch(err => console.error("DCC dice background: failed to open modal", err));

  // Fallback close in case dice-modal.html's own self-close timer never
  // fires for some reason (backgrounded tab throttling timers, etc).
  setTimeout(() => {
    OBR.modal.close(DICE_MODAL_ID).catch(() => {});
  }, 6500);
}

// Shared by both the auto-jump-on-select below and the context menu icon
// (kept as a manual fallback - e.g. re-opening a modal that was closed
// without deselecting the pin). GM Notes is GM-only (see index.html's
// refreshNotesTabVisibility) - there's no server-side privacy in OBR's
// model to actually stop a player selecting a pin themselves, so this
// checks the role itself before ever opening someone else's private
// notes, rather than relying on the context menu icon's own filter
// (which only matches item metadata, not player role).

// Brings a room's creatures onstage: moves each staged token (parked hidden
// in the strip beside the map - see gm-notes-modal.html) onto the pin,
// unhides it and its attached name label, switches it on in the Combat
// Tracker and clears the dim overlay the tracker draws over inactive
// tokens (same overlay index.html's setTokenDimmed makes). Only ever
// activates - creatures from rooms already fought in are left alone rather
// than guessing the GM is done with them mid-session. Tokens from before
// staging existed (inactive but never parked) are just activated in place.
async function activateEncounter(room, selectedPin) {
  const waiting = await OBR.scene.items.getItems(item =>
    item.metadata?.[ENCOUNTER_ROOM_METADATA_KEY] === room.id &&
    (item.metadata?.[ENCOUNTER_STAGED_METADATA_KEY] || item.metadata?.[COMBAT_METADATA_KEY]?.enabled === false));
  if (!waiting.length) return 0;
  const ids = waiting.map(i => i.id);

  // Where the pin's DOT actually sits: selecting its floating label should
  // land creatures on the dot, not on the label hovering above it.
  const dots = await OBR.scene.items.getItems(item => {
    const m = item.metadata?.[ROOM_PIN_METADATA_KEY];
    return m && !m.isTest && m.role !== "label" && m.id === room.id && m.doc === room.doc && m.x === room.x && m.y === room.y;
  });
  const pinBounds = await OBR.scene.items.getItemBounds([(dots[0] || selectedPin).id]);
  const center = { x: (pinBounds.min.x + pinBounds.max.x) / 2, y: (pinBounds.min.y + pinBounds.max.y) / 2 };

  // Fan the tokens out in a grid centred on the pin, shifting each by the
  // gap between where its bounds are now and where they should be - works
  // whichever point of the shape its `position` happens to anchor to.
  const staged = waiting.filter(i => i.metadata?.[ENCOUNTER_STAGED_METADATA_KEY]);
  const dpi = await OBR.scene.grid.getDpi();
  const cols = Math.ceil(Math.sqrt(staged.length));
  const rows = Math.ceil(staged.length / cols);
  const shifts = new Map();
  await Promise.all(staged.map(async (token, i) => {
    const b = await OBR.scene.items.getItemBounds([token.id]);
    const want = {
      x: center.x + ((i % cols) - (cols - 1) / 2) * dpi,
      y: center.y + (Math.floor(i / cols) - (rows - 1) / 2) * dpi,
    };
    shifts.set(token.id, { x: want.x - (b.min.x + b.max.x) / 2, y: want.y - (b.min.y + b.max.y) / 2 });
  }));

  // Name labels (and the dim overlay) are separate attached items - read
  // them BEFORE the update so unhiding them doesn't depend on whether an
  // attached item follows its parent's visibility automatically.
  const attached = await OBR.scene.items.getItems(item => ids.includes(item.attachedTo));
  await OBR.scene.items.updateItems(ids, items => {
    items.forEach(it => {
      it.metadata[COMBAT_METADATA_KEY] = { ...(it.metadata[COMBAT_METADATA_KEY] || {}), enabled: true };
      const shift = shifts.get(it.id);
      if (shift) {
        it.position = { x: it.position.x + shift.x, y: it.position.y + shift.y };
        it.visible = true;
        delete it.metadata[ENCOUNTER_STAGED_METADATA_KEY];
      }
    });
  });
  const overlays = attached.filter(i => i.metadata?.[DIM_OVERLAY_METADATA_KEY]);
  if (overlays.length) await OBR.scene.items.deleteItems(overlays.map(i => i.id));
  // Unhide the labels, and re-seat each on its token by measured bounds: an
  // attached item may or may not travel with its parent on a programmatic
  // move, so this corrects either way instead of guessing (a label left
  // behind in the staging strip would be visible there once unhidden).
  const labels = attached.filter(i => !i.metadata?.[DIM_OVERLAY_METADATA_KEY] && shifts.has(i.attachedTo));
  if (labels.length) {
    const fixes = new Map();
    await Promise.all(labels.map(async label => {
      const [tb, lb] = await Promise.all([
        OBR.scene.items.getItemBounds([label.attachedTo]),
        OBR.scene.items.getItemBounds([label.id]),
      ]);
      fixes.set(label.id, {
        x: (tb.min.x + tb.max.x) / 2 - (lb.min.x + lb.max.x) / 2,
        y: (tb.min.y + tb.max.y) / 2 - (lb.min.y + lb.max.y) / 2,
      });
    }));
    await OBR.scene.items.updateItems(labels.map(l => l.id), items => {
      items.forEach(it => {
        const fix = fixes.get(it.id);
        if (fix && (Math.abs(fix.x) > 1 || Math.abs(fix.y) > 1)) {
          it.position = { x: it.position.x + fix.x, y: it.position.y + fix.y };
        }
        it.visible = true;
      });
    });
  }
  return ids.length;
}

async function openRoomNotes(room, selectedPin) {
  try {
    const role = await OBR.player.getRole();
    if (role !== "GM") return;
    if (!room || room.isTest) return;
    // Independent of the notes jump below - a failure here (or in it)
    // shouldn't stop the other from happening.
    activateEncounter(room, selectedPin).then(count => {
      if (count) OBR.notification.show(`Room ${room.id}: ${count} creature${count === 1 ? "" : "s"} activated in the tracker.`).catch(() => {});
    }).catch(err => console.error("DCC overlay: failed to activate room encounter", err));
    const params = new URLSearchParams({ jumpId: room.id });
    OBR.modal.open({
      id: GM_NOTES_MODAL_ID,
      url: `${GM_NOTES_MODAL_URL}?${params.toString()}`,
      width: 1300,
      height: 760,
    }).catch(() => {});
    // Handles the modal-already-open case, where the open() call above is
    // a no-op and its query params never reach the page.
    OBR.broadcast.sendMessage(JUMP_TO_ROOM_CHANNEL, { id: room.id }).catch(() => {});
  } catch (err) {
    console.error("DCC overlay: failed to open room notes", err);
  }
}

OBR.onReady(() => {
  OBR.broadcast.onMessage(DICE_ROLL_CHANNEL, (event) => {
    try {
      openDiceModal(event.data);
    } catch (err) {
      console.error("DCC dice background: failed to handle roll broadcast", err);
    }
  });

  OBR.contextMenu.create({
    id: "com.claude.monster-sheet/open-room-pin",
    icons: [
      {
        icon: "https://ostendpirate.github.io/Crawl-Bear-Classics/icon.svg",
        label: "Open Room Notes",
        filter: {
          every: [{ key: ["metadata", ROOM_PIN_METADATA_KEY], value: undefined, operator: "!=" }],
        },
      },
    ],
    onClick(context) {
      openRoomNotes(context.items[0]?.metadata?.[ROOM_PIN_METADATA_KEY], context.items[0]);
    },
  });

  // Jump straight to a pin's notes the moment it's SELECTED, rather than
  // making the GM select it and then separately click the context menu
  // icon above - a pin only exists to link a map spot to its notes, so
  // there's no real case where selecting one and NOT wanting its notes
  // matters enough to justify the extra click. lastPinSelectionId guards
  // against OBR.player.onChange firing for reasons other than a genuinely
  // NEW selection (tool switches, sync state, etc - see index.html's own
  // onChange comment for the full list) re-triggering this repeatedly for
  // a selection that hasn't actually changed.
  let lastPinSelectionId = null;
  OBR.player.onChange(async (player) => {
    const selection = player.selection;
    const id = selection && selection.length === 1 ? selection[0] : null;
    if (id === lastPinSelectionId) return;
    lastPinSelectionId = id;
    if (!id) return;
    try {
      const [item] = await OBR.scene.items.getItems([id]);
      const room = item?.metadata?.[ROOM_PIN_METADATA_KEY];
      if (room) await openRoomNotes(room, item);
    } catch (err) {
      console.error("DCC overlay: failed to check selection for a room pin", err);
    }
  });
});
</script>
</body>
</html>
