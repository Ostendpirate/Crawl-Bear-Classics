<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GM Notes</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1e1b18;
    --panel: #2a2521;
    --border: #45392e;
    --text: #ecdfc8;
    --muted: #a89684;
    --accent: #c97b3d;
    --good: #5f8f5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 14px 16px 16px; }
  h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: 0.3px; }
  .subtitle { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  .row { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  textarea {
    flex: 1;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .fumble-die-note { font-size: 10px; color: var(--muted); }
  .btn-next {
    background: var(--accent);
    color: #1e1b18;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-next:hover { opacity: 0.9; }
  .hp-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .hp-btn:hover { background: #574739; }
  .footer-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .mode-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .mode-tab-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-tab-btn:hover { border-color: var(--accent); }
  .mode-tab-btn.active { background: var(--accent); color: #1e1b18; border-color: var(--accent); }
  .notes-preview {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    line-height: 1.55;
  }
  .notes-preview > :first-child { margin-top: 0; }
  .notes-preview > :last-child { margin-bottom: 0; }
  .notes-preview h1, .notes-preview h2, .notes-preview h3 {
    color: var(--accent);
    margin: 0.7em 0 0.3em;
    line-height: 1.3;
  }
  .notes-preview h1 { font-size: 1.4em; }
  .notes-preview h2 { font-size: 1.2em; }
  .notes-preview h3 { font-size: 1.05em; }
  .notes-preview p { margin: 0.5em 0; }
  .notes-preview ul, .notes-preview ol { margin: 0.5em 0; padding-left: 1.4em; }
  .notes-preview li { margin: 0.2em 0; }
  .notes-preview code { background: var(--border); border-radius: 3px; padding: 1px 4px; font-size: 0.9em; }
  .notes-preview pre { background: var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
  .notes-preview pre code { background: none; padding: 0; }
  .notes-preview blockquote { border-left: 3px solid var(--accent); margin: 0.5em 0; padding: 2px 12px; color: var(--muted); }
  .notes-preview hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  .notes-preview a { color: var(--accent); }
  .notes-preview table { border-collapse: collapse; margin: 0.5em 0; }
  .notes-preview th, .notes-preview td { border: 1px solid var(--border); padding: 4px 8px; }
  .notes-preview strong { color: var(--text); }
</style>
</head>
<body>
  <div id="app">
    <h1>GM Notes</h1>
    <div class="subtitle">Private scratch space, hidden from players - session prep, secrets, NPC motives, whatever. It's still ordinary scene data underneath (same as the roll log), not encrypted, so treat it as "a player won't casually stumble onto this," not "a player can never access this."</div>
    <div class="row">
      <div style="flex:0 0 auto;">
        <label>Import from PDF or Markdown/Text</label>
        <input type="file" id="gm-notes-pdf-file" accept="application/pdf,.pdf,.md,.markdown,text/markdown,.txt,text/plain" />
      </div>
      <div class="fumble-die-note" id="gm-notes-import-status" style="flex:1 1 auto;"></div>
    </div>
    <div class="mode-tabs">
      <button type="button" class="mode-tab-btn" id="gm-notes-preview-btn">👁 Preview</button>
      <button type="button" class="mode-tab-btn" id="gm-notes-edit-btn">✏️ Edit</button>
    </div>
    <textarea id="gm-notes-textarea" placeholder="Session prep, secrets, NPC motives... (Markdown - headings, **bold**, lists, etc)"></textarea>
    <div class="notes-preview" id="gm-notes-preview" style="display:none"></div>
    <div class="footer-row">
      <button type="button" class="btn-next" id="gm-notes-save-btn">💾 Save</button>
      <button type="button" class="hp-btn" id="gm-notes-clear-btn" title="Wipes these notes from this scene.">Clear</button>
      <div class="fumble-die-note" id="gm-notes-save-status"></div>
    </div>
  </div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

// Same key index.html used to write when this lived inline in the Notes
// tab - keeping it identical is what lets this modal read/write the exact
// same scene data.
const GM_NOTES_METADATA_KEY = "com.claude.monster-sheet/gm-notes";

let lastGmNotes = "";
// "preview" is the default since this modal's whole point is reviewing
// notes during play - Edit is where typing/importing happens, and saving
// or switching back to Preview re-renders from the textarea's raw text.
let notesMode = "preview";

function refreshGmNotesTextarea() {
  const el = document.getElementById("gm-notes-textarea");
  // Skipped while focused so an incoming metadata echo (this same save,
  // or another GM client's edit) never clobbers text being typed here.
  if (el && document.activeElement !== el) el.value = lastGmNotes;
  if (notesMode === "preview") renderNotesPreview();
}

// marked + DOMPurify are only needed to render Preview, so they're loaded
// lazily from the same esm.sh CDN this page already pulls the OBR SDK and
// pdf.js from - no bundler/build step here to vendor them into.
let markdownLibsPromise = null;
function loadMarkdownLibs() {
  if (!markdownLibsPromise) {
    markdownLibsPromise = Promise.all([
      import("https://esm.sh/marked@13.0.3"),
      import("https://esm.sh/dompurify@3.1.6"),
    ]).then(([markedMod, dompurifyMod]) => ({
      marked: markedMod.marked,
      DOMPurify: dompurifyMod.default,
    }));
  }
  return markdownLibsPromise;
}

async function renderNotesPreview() {
  const previewEl = document.getElementById("gm-notes-preview");
  const raw = document.getElementById("gm-notes-textarea").value;
  if (!raw.trim()) {
    previewEl.innerHTML = `<div class="fumble-die-note">Nothing written yet - switch to Edit to start typing or import a file.</div>`;
    return;
  }
  try {
    const { marked, DOMPurify } = await loadMarkdownLibs();
    // Sanitized even though this is the GM's own content, not untrusted
    // input - it's still rendered via innerHTML, and a PDF/markdown file
    // dropped in from someone else (a downloaded module, a player's
    // shared handout) is exactly the kind of "content from outside this
    // session" this guards against.
    previewEl.innerHTML = DOMPurify.sanitize(marked.parse(raw));
  } catch (err) {
    console.error("DCC GM notes: markdown render failed", err);
    previewEl.textContent = raw;
  }
}

function setNotesMode(mode) {
  notesMode = mode;
  document.getElementById("gm-notes-preview-btn").classList.toggle("active", mode === "preview");
  document.getElementById("gm-notes-edit-btn").classList.toggle("active", mode === "edit");
  document.getElementById("gm-notes-textarea").style.display = mode === "edit" ? "block" : "none";
  document.getElementById("gm-notes-preview").style.display = mode === "preview" ? "block" : "none";
  if (mode === "preview") renderNotesPreview();
  else document.getElementById("gm-notes-textarea").focus();
}
document.getElementById("gm-notes-preview-btn").addEventListener("click", () => setNotesMode("preview"));
document.getElementById("gm-notes-edit-btn").addEventListener("click", () => setNotesMode("edit"));
setNotesMode("preview");

function appendToGmNotes(file, text) {
  const textarea = document.getElementById("gm-notes-textarea");
  const heading = `--- Imported from ${file.name} ---\n`;
  textarea.value = (textarea.value ? `${textarea.value}\n\n` : "") + heading + text;
}

// pdf.js is only needed once a GM actually picks a PDF, so it's loaded
// lazily from the same esm.sh CDN this page already pulls the OBR SDK
// from - no bundler/build step here to vendor it into.
let pdfjsLibPromise = null;
function loadPdfJs() {
  if (!pdfjsLibPromise) {
    pdfjsLibPromise = import("https://esm.sh/pdfjs-dist@4.6.82/build/pdf.mjs").then((lib) => {
      lib.GlobalWorkerOptions.workerSrc = "https://esm.sh/pdfjs-dist@4.6.82/build/pdf.worker.mjs";
      return lib;
    });
  }
  return pdfjsLibPromise;
}

document.getElementById("gm-notes-pdf-file").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const statusEl = document.getElementById("gm-notes-import-status");
  statusEl.style.color = "";
  // Switch to Edit right away so the appended raw text lands somewhere
  // visible - importing while sitting in Preview would silently write into
  // a hidden textarea with nothing on screen changing.
  setNotesMode("edit");

  // Markdown/plain text is already exactly what the notes field holds, so
  // it skips pdf.js entirely and just reads as text.
  if (/\.(md|markdown|txt)$/i.test(file.name)) {
    statusEl.textContent = "Reading file...";
    const reader = new FileReader();
    reader.onload = () => {
      appendToGmNotes(file, String(reader.result || ""));
      statusEl.textContent = `Imported ${file.name} - review below, then Save.`;
      statusEl.style.color = "var(--good)";
    };
    reader.onerror = () => {
      console.error("DCC GM notes: text import failed", reader.error);
      statusEl.textContent = "Couldn't read that file.";
      statusEl.style.color = "#c97b7b";
    };
    reader.readAsText(file);
    return;
  }

  statusEl.textContent = "Reading PDF...";
  try {
    const pdfjsLib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    const pageTexts = [];
    for (let i = 1; i <= doc.numPages; i++) {
      statusEl.textContent = `Reading PDF... page ${i}/${doc.numPages}`;
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      pageTexts.push(content.items.map(item => item.str).join(" ").trim());
    }
    appendToGmNotes(file, pageTexts.join("\n\n"));
    statusEl.textContent = `Imported ${doc.numPages} page${doc.numPages === 1 ? "" : "s"} from ${file.name} - review below, then Save. (Scanned/image-only pages won't have extractable text.)`;
    statusEl.style.color = "var(--good)";
  } catch (err) {
    console.error("DCC GM notes: PDF import failed", err);
    statusEl.textContent = "Couldn't read that PDF - it may be scanned/image-only, password-protected, or corrupted.";
    statusEl.style.color = "#c97b7b";
  }
});

document.getElementById("gm-notes-save-btn").addEventListener("click", async () => {
  const statusEl = document.getElementById("gm-notes-save-status");
  const value = document.getElementById("gm-notes-textarea").value;
  try {
    lastGmNotes = value;
    await OBR.scene.setMetadata({ [GM_NOTES_METADATA_KEY]: value });
    statusEl.textContent = "Saved.";
    statusEl.style.color = "var(--good)";
    setNotesMode("preview");
    clearTimeout(document.getElementById("gm-notes-save-btn")._statusTimeout);
    document.getElementById("gm-notes-save-btn")._statusTimeout = setTimeout(() => { statusEl.textContent = ""; }, 3000);
  } catch (err) {
    console.error("DCC GM notes: save failed", err);
    statusEl.textContent = `Save failed: ${err.message}`;
    statusEl.style.color = "#c97b7b";
  }
});

document.getElementById("gm-notes-clear-btn").addEventListener("click", async () => {
  const statusEl = document.getElementById("gm-notes-save-status");
  try {
    lastGmNotes = "";
    document.getElementById("gm-notes-textarea").value = "";
    await OBR.scene.setMetadata({ [GM_NOTES_METADATA_KEY]: "" });
    statusEl.textContent = "Cleared.";
    statusEl.style.color = "var(--good)";
    setNotesMode("preview");
  } catch (err) {
    console.error("DCC GM notes: clear failed", err);
    statusEl.textContent = `Clear failed: ${err.message}`;
    statusEl.style.color = "#c97b7b";
  }
});

OBR.onReady(async () => {
  OBR.scene.onMetadataChange((metadata) => {
    if (typeof metadata[GM_NOTES_METADATA_KEY] === "string") {
      lastGmNotes = metadata[GM_NOTES_METADATA_KEY];
      refreshGmNotesTextarea();
    }
  });
  try {
    const sceneMeta = await OBR.scene.getMetadata();
    lastGmNotes = typeof sceneMeta[GM_NOTES_METADATA_KEY] === "string" ? sceneMeta[GM_NOTES_METADATA_KEY] : "";
    refreshGmNotesTextarea();
  } catch (err) {
    console.error("DCC GM notes: initial scene.getMetadata failed", err);
  }
});
</script>
</body>
</html>
