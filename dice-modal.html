<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DCC Dice Roll</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #dice-stage {
    position: fixed;
    inset: 0;
  }
  .die-sprite {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--die-size, 58px);
    height: var(--die-size, 58px);
    margin-top: calc(var(--die-size, 58px) * -0.5);
    margin-left: calc(var(--die-size, 58px) * -0.5);
    opacity: 0;
    will-change: transform, opacity;
    animation: dcc-tumble 950ms cubic-bezier(.2,.8,.2,1) forwards;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45));
  }
  /* The shape (clip-path) lives on this inner element, not the sprite
     itself. Clipping an element also clips its own box-shadow, so any
     "glow" has to come from a CSS filter on the unclipped parent instead -
     filter: drop-shadow() is computed from the child's painted alpha shape,
     so it correctly outlines the polygon rather than a rectangle. */
  .die-face {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: linear-gradient(145deg, #d98f4e, #a5602a);
    border: 2px solid #f0c896;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    color: #241d16;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .die-face .die-type {
    font-size: calc(var(--die-size, 58px) * 0.155);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    opacity: 0.75;
    line-height: 1;
  }
  .die-face .die-value {
    font-size: calc(var(--die-size, 58px) * 0.38);
    font-weight: 800;
    line-height: 1.15;
  }
  .die-sprite.settled {
    animation: dcc-settle-pulse 420ms ease-out 950ms 1;
  }
  .die-sprite.fading {
    animation: dcc-fade-out 450ms ease-in forwards;
  }
  @keyframes dcc-tumble {
    0% { transform: translate(var(--start-x), var(--start-y)) rotate(0deg) scale(0.5); opacity: 0; }
    12% { opacity: 1; }
    55% { transform: translate(var(--mid-x), var(--mid-y)) rotate(640deg) scale(1.18); }
    100% { transform: translate(var(--end-x), var(--end-y)) rotate(830deg) scale(1); opacity: 1; }
  }
  @keyframes dcc-settle-pulse {
    0% { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)) drop-shadow(0 0 0 rgba(240,200,150,0.6)); }
    60% { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)) drop-shadow(0 0 14px rgba(240,200,150,0)); }
    100% { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)) drop-shadow(0 0 0 rgba(240,200,150,0)); }
  }
  @keyframes dcc-fade-out {
    to { transform: translate(var(--end-x), var(--end-y)) scale(0.8); opacity: 0; }
  }
  .roll-banner {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -8px);
    background: rgba(30, 27, 24, 0.88);
    border: 1px solid #45392e;
    color: #ecdfc8;
    padding: 6px 14px;
    border-radius: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    animation: dcc-banner-in 400ms ease-out 700ms forwards, dcc-banner-out 450ms ease-in 2600ms forwards;
  }
  .roll-banner .accent { color: #c97b3d; }
  @keyframes dcc-banner-in { to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes dcc-banner-out { to { opacity: 0; transform: translate(-50%, -8px); } }
</style>
</head>
<body>
<div id="dice-stage"></div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

const MODAL_ID = "com.claude.monster-sheet/dice-modal";
const stage = document.getElementById("dice-stage");

// Every die in the DCC chain gets its own silhouette + relative size,
// rather than one rounded-square rendered for every value of `sides`.
// `n` is the polygon vertex count used to draw the face, `rotation` orients
// it (degrees, -90 = point-up), and `scale` multiplies the base pixel size
// so bigger dice actually read as bigger on screen. Where two dice share a
// vertex count (d10/d12 as pentagons, d7/d14 as heptagons) a different
// rotation offset keeps their silhouettes visually distinct.
const DIE_VISUALS = {
  3:   { n: 3,  rotation: -90,    scale: 0.80 },
  4:   { n: 3,  rotation: -90,    scale: 0.85 },
  5:   { n: 5,  rotation: -90,    scale: 0.90 },
  6:   { n: 4,  rotation: 45,     scale: 1.00 },
  7:   { n: 7,  rotation: -90,    scale: 1.05 },
  8:   { n: 4,  rotation: 0,      scale: 1.08 },
  10:  { n: 5,  rotation: -90,    scale: 1.14 },
  12:  { n: 5,  rotation: -54,    scale: 1.22 },
  14:  { n: 7,  rotation: -64.29, scale: 1.27 },
  16:  { n: 8,  rotation: -67.5,  scale: 1.32 },
  20:  { n: 6,  rotation: -90,    scale: 1.38 },
  24:  { n: 9,  rotation: -90,    scale: 1.44 },
  30:  { n: 14, rotation: -90,    scale: 1.52 },
  100: { n: 5,  rotation: -18,    scale: 1.16 },
};

function getDieVisual(sides) {
  return DIE_VISUALS[sides] || DIE_VISUALS[6];
}

function regularPolygonClipPath(n, rotationDeg) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (rotationDeg + (360 / n) * i) * Math.PI / 180;
    const x = (50 + 50 * Math.cos(angle)).toFixed(2);
    const y = (50 + 50 * Math.sin(angle)).toFixed(2);
    pts.push(`${x}% ${y}%`);
  }
  return `polygon(${pts.join(", ")})`;
}

function dieClipPath(sides) {
  const v = getDieVisual(sides);
  return regularPolygonClipPath(v.n, v.rotation);
}

function dieSizePx(sides, basePx) {
  return Math.round(getDieVisual(sides).scale * basePx);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

let audioCtx = null;
function getAudioCtx() {
  if (audioCtx) return audioCtx;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (err) {
    audioCtx = null;
  }
  return audioCtx;
}

function playRollSound(diceCount) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume().catch(() => {});
  const now = ctx.currentTime;
  const clackCount = Math.min(9, 3 + diceCount * 2);
  for (let i = 0; i < clackCount; i++) {
    playClack(ctx, now + Math.random() * 0.85, 0.5 + Math.random() * 0.5);
  }
  playThud(ctx, now + 0.95);
}

function playClack(ctx, time, gainScale) {
  try {
    const dur = 0.045;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1100 + Math.random() * 1600;
    filter.Q.value = 1.1;
    const gain = ctx.createGain();
    gain.gain.value = 0.25 * gainScale;
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(time);
  } catch (err) { /* best effort */ }
}

function playThud(ctx, time) {
  try {
    const dur = 0.14;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.4);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 380;
    const gain = ctx.createGain();
    gain.gain.value = 0.4;
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(time);
  } catch (err) { /* best effort */ }
}

// `dice` arrives as "sides:value" pairs (e.g. "20:14,6:5,6:3") so a single
// roll can mix die shapes - an attack's d20, its damage die(s), and a
// Warrior/Dwarf Deed Die can all tumble together instead of only ever
// showing one uniform die type.
function parsePayloadFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const dice = (params.get("dice") || "")
    .split(",")
    .filter(Boolean)
    .map(pair => {
      const [sidesStr, valueStr] = pair.split(":");
      const sides = parseInt(sidesStr, 10);
      const value = parseInt(valueStr, 10);
      return (Number.isNaN(sides) || Number.isNaN(value)) ? null : { sides, value };
    })
    .filter(Boolean);
  return {
    rollerName: params.get("roller") || "Someone",
    notation: params.get("notation") || "",
    modifier: parseInt(params.get("modifier") || "0", 10),
    total: parseInt(params.get("total") || "0", 10),
    label: params.get("label") || "",
    dice,
  };
}

function spawnRoll(payload) {
  const dice = payload.dice;
  if (!dice.length) return 0;

  const w = window.innerWidth;
  const h = window.innerHeight;
  const centerX = w / 2;
  const centerY = h / 2;
  const clusterSpread = Math.min(160, 34 * dice.length);

  dice.forEach((die, i) => {
    const angle = Math.random() * Math.PI * 2;
    const startRadius = Math.max(w, h) * 0.75;
    const startX = centerX + Math.cos(angle) * startRadius;
    const startY = centerY + Math.sin(angle) * startRadius;
    const midX = centerX + (Math.random() - 0.5) * clusterSpread * 1.5;
    const midY = centerY + (Math.random() - 0.5) * clusterSpread * 1.5;
    const endAngle = (i / dice.length) * Math.PI * 2 + Math.random() * 0.6;
    const endRadius = dice.length > 1 ? clusterSpread * 0.4 : 0;
    const endX = centerX + Math.cos(endAngle) * endRadius;
    const endY = centerY + Math.sin(endAngle) * endRadius;

    const el = document.createElement("div");
    el.className = "die-sprite";
    const sizePx = dieSizePx(die.sides, 58);
    el.style.setProperty("--die-size", `${sizePx}px`);
    el.style.setProperty("--start-x", `${startX}px`);
    el.style.setProperty("--start-y", `${startY}px`);
    el.style.setProperty("--mid-x", `${midX}px`);
    el.style.setProperty("--mid-y", `${midY}px`);
    el.style.setProperty("--end-x", `${endX}px`);
    el.style.setProperty("--end-y", `${endY}px`);
    el.style.animationDelay = `${i * 60}ms`;
    el.innerHTML = `<div class="die-face" style="clip-path:${dieClipPath(die.sides)}"><div class="die-type">d${die.sides}</div><div class="die-value">${die.value}</div></div>`;
    stage.appendChild(el);

    setTimeout(() => el.classList.add("settled"), 950 + i * 60);
    setTimeout(() => el.classList.add("fading"), 2400 + i * 60);
  });

  // A custom label (e.g. "17 to hit, 9 dmg") replaces the generic
  // "rolls NdX +mod: total" phrasing for rolls that combine more than one
  // kind of result (attack + damage, HP gained) where a single notation/
  // modifier/total triple can't describe what happened.
  const banner = document.createElement("div");
  banner.className = "roll-banner";
  banner.style.top = `${centerY - 70}px`;
  if (payload.label) {
    banner.innerHTML = `${escapeHtml(payload.rollerName)} — <span class="accent">${escapeHtml(payload.label)}</span>`;
  } else {
    const modText = payload.modifier ? (payload.modifier > 0 ? ` +${payload.modifier}` : ` ${payload.modifier}`) : "";
    banner.innerHTML = `${escapeHtml(payload.rollerName)} rolls ${escapeHtml(payload.notation)}${modText}: <span class="accent">${payload.total}</span>`;
  }
  stage.appendChild(banner);

  playRollSound(dice.length);

  return 2900 + dice.length * 60;
}

OBR.onReady(() => {
  const payload = parsePayloadFromUrl();
  const totalDuration = spawnRoll(payload);
  // Self-close once the animation has fully played out. The background
  // page also has a longer fallback timeout in case this ever fails to
  // fire (e.g. the tab was backgrounded and timers got throttled).
  setTimeout(() => {
    OBR.modal.close(MODAL_ID).catch(() => {});
  }, totalDuration + 200);
});
</script>
</body>
</html>
